provider: api
prompt_version: v2-calibrated

api:
  base_url: https://api.deepseek.com
  base_url_env: OPENAI_BASE_URL
  endpoint: /chat/completions
  model: deepseek-v4-flash
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 30
  timeout_seconds_by_agent:
    news_agent: 45
    ai_gated_news_agent: 45
    challenge_agent: 75
    decision_manager: 60
    catalyst_challenge_agent: 75
    catalyst_decision_manager: 60
    ai_gated_challenge_agent: 75
    ai_gated_decision_manager: 60
    news_drift_headline_agent: 45
  max_retries: 1
  max_tokens: 3072
  max_tokens_by_agent:
    catalyst_candidate_extractor: 700
    catalyst_ranker: 1600
    catalyst_bull_news_agent: 1200
    catalyst_challenge_agent: 2200
    catalyst_decision_manager: 4096
    ai_gated_ranker: 1600
    ai_gated_news_agent: 1200
    ai_gated_challenge_agent: 2200
    ai_gated_decision_manager: 4096
    news_drift_headline_agent: 1400
  response_format: json_object
  structured_retry_max_tokens: 4096
  # Keep extraction and challenge passes fast. Thinking is reserved for the
  # final synthesis stages that decide whether a proposal is actionable now.
  # The dashboard presents their structured rationale, not private raw CoT.
  thinking:
    default:
      type: disabled
    agents:
      challenge_agent:
        type: disabled
      decision_manager:
        type: enabled
      catalyst_candidate_extractor:
        type: disabled
      catalyst_ranker:
        type: disabled
      catalyst_bull_news_agent:
        type: disabled
      catalyst_challenge_agent:
        type: disabled
      catalyst_decision_manager:
        type: enabled
      ai_gated_ranker:
        type: disabled
      ai_gated_news_agent:
        type: disabled
      ai_gated_challenge_agent:
        type: disabled
      ai_gated_decision_manager:
        type: enabled
      news_drift_headline_agent:
        type: disabled
  input_cost_per_million_usd: 0.14
  output_cost_per_million_usd: 0.28

local:
  enabled: false
  model: not-configured

usage_log: logs/llm_usage.jsonl
