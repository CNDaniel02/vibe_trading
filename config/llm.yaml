provider: api
prompt_version: v2-calibrated

api:
  base_url: https://api.deepseek.com
  base_url_env: OPENAI_BASE_URL
  endpoint: /chat/completions
  model: deepseek-v4-pro
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 45
  max_retries: 2
  max_tokens: 4096
  response_format: json_object
  # Keep fact extraction fast, but retain DeepSeek thinking for the two stages
  # that weigh contrary evidence and make the shadow investment conclusion.
  # The dashboard presents their structured rationale, not private raw CoT.
  thinking:
    default:
      type: disabled
    agents:
      challenge_agent:
        type: enabled
      decision_manager:
        type: enabled
  input_cost_per_million_usd: 0.435
  output_cost_per_million_usd: 0.87

local:
  enabled: false
  model: not-configured

usage_log: logs/llm_usage.jsonl
