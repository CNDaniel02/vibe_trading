provider: mock
prompt_version: v1

api:
  base_url: https://api.openai.com/v1
  endpoint: /chat/completions
  model: gpt-4.1-mini
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 45
  max_retries: 2
  input_cost_per_million_usd: null
  output_cost_per_million_usd: null

local:
  enabled: false
  model: not-configured

usage_log: logs/llm_usage.jsonl
